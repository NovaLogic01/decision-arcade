<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5401678251896562" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yes or No | Decision Arcade</title>
    <meta name="description" content="A simple yes or no generator for when you just need a binary answer.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <nav class="site-nav">
                <a href="/" class="logo">Decision Arcade</a>
                <div class="links">
                    <a href="/decision-maker/">Tools</a>
                    <a href="/about/">About</a>
                </div>
            </nav>
        </header>

        <main id="main-content" style="padding: 4rem 0;">
            <div class="ad-slot ad-slot-header"></div>

            <div class="screen active text-center reveal">
                <h1 style="margin-bottom: 1rem;">Yes or No?</h1>
                <p class="text-muted" style="margin-bottom: 3rem;">Focus on your question, then click.</p>
                
                <button class="btn btn-primary" onclick="generate()" style="padding: 1.5rem 4rem; font-size: 1.5rem;">Decide</button>
                
                <div id="result-area" style="min-height: 250px; display: flex; align-items: center; justify-content: center; margin-top: 2rem;"></div>
            </div>

            <div class="ad-slot ad-slot-content"></div>
        </main>

        <footer class="site-footer">
            <div class="links">
                <a href="/about/">About</a>
                <a href="/privacy/">Privacy Policy</a>
                <a href="/terms/">Terms of Service</a>
                <a href="/contact/">Contact</a>
            </div>
            <p class="text-muted" style="font-size: 0.85rem;">&copy; 2026 Decision Arcade. All rights reserved.</p>
        </footer>
    </div>
    
    <script src="/js/app.js"></script>
    <script>
        function generate() {
            const area = document.getElementById('result-area');
            area.innerHTML = '<div class="text-accent text-lg">Thinking...</div>';
            
            setTimeout(() => {
                const isYes = Math.random() > 0.5;
                const result = isYes ? 'YES' : 'NO';
                
                area.innerHTML = 
                    <div class="verdict-result reveal">
                        <div class="verdict-text"> + result + </div>
                    </div>
                ;
            }, 800);
        }
    </script>
</body>
</html>
