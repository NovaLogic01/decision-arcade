<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5401678251896562" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What Should I Eat? | Decision Arcade</title>
    <meta name="description" content="Can't decide what to eat for dinner? Use our random food picker to break through takeout paralysis.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">
    <style>
      .mood-btn { padding: 1rem 1.5rem; background: transparent; border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-primary); cursor: pointer; transition: all var(--transition-fast); }
      .mood-btn:hover { border-color: var(--accent); background: rgba(255,255,255,0.02); }
      .mood-grid { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; max-width: 600px; margin: 0 auto; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#050508">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/favicon.svg">
</head>
<body>
    <div class="container">
        <header>
            <nav class="site-nav">
                <a href="/" class="logo">Decision Arcade</a>
                <div class="links">
                    <a href="/decision-maker/">Tools</a>
                    <a href="/about/">About</a>
                </div>
            </nav>
        </header>

        <main id="main-content" style="padding: 4rem 0;">
            <div class="ad-slot ad-slot-header"></div>

            <div class="screen active text-center reveal">
                <h1 style="margin-bottom: 1rem;">What Should I Eat?</h1>
                <p class="text-muted" style="margin-bottom: 3rem;">Select your mood. We'll pick the food.</p>
                
                <div class="mood-grid">
                    <button class="mood-btn" onclick="pickFood('anything')">Literally Anything</button>
                    <button class="mood-btn" onclick="pickFood('cheap')">Cheap & Easy</button>
                    <button class="mood-btn" onclick="pickFood('healthy')">Healthy / Fresh</button>
                    <button class="mood-btn" onclick="pickFood('comforting')">Comfort Food</button>
                    <button class="mood-btn" onclick="pickFood('surprise')">Surprise Me</button>
                </div>
                
                <div id="result-area" style="min-height: 250px; display: flex; align-items: center; justify-content: center; margin-top: 2rem;"></div>
            </div>

            <div class="ad-slot ad-slot-content"></div>
        </main>

        <footer class="site-footer">
            <div class="links">
                <a href="/about/">About</a>
                <a href="/privacy/">Privacy Policy</a>
                <a href="/terms/">Terms of Service</a>
                <a href="mailto:studiolaurent15@gmail.com">Contact</a>
            </div>
            <p class="text-muted" style="font-size: 0.85rem;">&copy; 2026 Decision Arcade. All rights reserved.</p>
        </footer>
    </div>
    
    <script src="/js/animations.js"></script>
    <script src="/js/app.js"></script>
    <script>
        const foods = {
            anything: ['Pizza', 'Pasta', 'Sushi', 'Tacos', 'A burger', 'Stir fry', 'Sandwich', 'Curry'],
            cheap: ['Rice and beans', 'Instant ramen', 'Grilled cheese', 'Eggs any way', 'PB&J', 'Quesadilla'],
            healthy: ['A big salad', 'Grain bowl', 'Grilled chicken & veggies', 'Soup', 'Smoothie bowl', 'Stir-fried tofu'],
            comforting: ['Mac and cheese', 'Ramen', 'Pizza', 'Grilled cheese & tomato soup', 'Fried rice', 'Pancakes for dinner'],
            surprise: [] 
        };
        Object.keys(foods).forEach(k => {
            if(k !== 'surprise') foods.surprise = foods.surprise.concat(foods[k]);
        });

        function pickFood(mood) {
            const area = document.getElementById('result-area');
            area.innerHTML = '<div class="text-accent text-lg">Thinking...</div>';
            
            setTimeout(() => {
                const list = foods[mood];
                const choice = list[Math.floor(Math.random() * list.length)];
                
                area.innerHTML = 
                    <div class="verdict-result reveal">
                        <div class="verdict-tagline">You should have</div>
                        <div class="verdict-text"> + choice + </div>
                    </div>
                ;
            }, 800);
        }
    </script>
</body>
</html>
