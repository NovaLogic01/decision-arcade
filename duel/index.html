<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5401678251896562" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duel � Head-to-Head Decision Maker | Decision Arcade</title>
    <meta name="description" content="Can't decide between two options? Pit them head-to-head in a sudden death match. Share the link with friends to let them reveal the winner.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <nav class="site-nav">
                <a href="/" class="logo">Decision Arcade</a>
                <div class="links">
                    <a href="/decision-maker/">Tools</a>
                    <a href="/about/">About</a>
                </div>
            </nav>
        </header>

        <main id="main-content" style="padding: 4rem 0;">
            <div class="ad-slot ad-slot-header"></div>

            <div id="duel-container" class="screen active text-center reveal">
                <h1 style="margin-bottom: 1rem;">Duel</h1>
                <p class="text-muted" style="margin-bottom: 3rem;">Two enter. One leaves.</p>
                <!-- duel.js mounts here -->
            </div>

            <div class="ad-slot ad-slot-content"></div>
        </main>

        <footer class="site-footer">
            <div class="links">
                <a href="/about/">About</a>
                <a href="/privacy/">Privacy Policy</a>
                <a href="/terms/">Terms of Service</a>
                <a href="/contact/">Contact</a>
            </div>
            <p class="text-muted" style="font-size: 0.85rem;">&copy; 2026 Decision Arcade. All rights reserved.</p>
        </footer>
    </div>
    
    <script src="/js/app.js"></script>
    <script src="/js/duel.js"></script>
    <script src="/js/history.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.DecisionArcade.Duel) {
                window.DecisionArcade.Duel.init(document.getElementById('duel-container'));
            }
        });
    </script>
</body>
</html>
